name: Deploy and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Supabase Connection Test
        run: node test_supabase.js

  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ml-search Edge Function
        run: |
          supabase functions deploy ml-search --project-ref yiolvrhxjkozebcorqep --no-verify-jwt --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
